<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин онлайн</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Добро пожаловать в наш магазин!</h1>
        <p>Широкий ассортимент товаров для вашего удобства.</p>
    </header>

    <!-- Форма поиска товаров -->
    <section class="search-bar">
        <input type="text" id="productSearch" placeholder="Введите название товара для поиска">
        <button id="searchBtn">Найти</button>
    </section>

    <!-- Контейнер для отображения товаров -->
    <section id="productContainer">
        <!-- Здесь будут отображаться карточки товаров -->
    </section>

    <footer>
        <p>&copy; 2025 Интернет-магазин. Все права защищены.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
