<!DOCTYPE html>
<!-- Объявление типа документа - говорит браузеру, что это HTML5 -->
<html lang="ru">
<!-- Открывающий тег html с указанием языка страницы (русский) -->
<head>
    <!-- Служебная информация о странице (не отображается на экране) -->
    <meta charset="UTF-8">
    <!-- Указывает кодировку символов - UTF-8 поддерживает русские буквы и спецсимволы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Настройка отображения на мобильных устройствах:
         width=device-width - ширина равна ширине экрана устройства
         initial-scale=1.0 - начальный масштаб 100% (не увеличивать) -->
    
    <!-- ЗАГОЛОВОК СТРАНИЦЫ - отображается на вкладке браузера -->
    <!-- ВАЖНО: Здесь указана фамилия и группа студента (по заданию) -->
    <title>Корзина - Палехова Мария Алексеевна 241-372</title>
    
    <!-- ПОДКЛЮЧЕНИЕ СТИЛЕЙ (CSS) -->
    <!-- Сначала подключаем общие стили для всего сайта (хедер, футер, уведомления) -->
    <!-- "../" означает подняться на уровень выше (из папки cart в корень) -->
    <link rel="stylesheet" href="../main/style.css">
    
    <!-- Затем подключаем специфические стили только для страницы корзины -->
    <!-- Они находятся в той же папке, поэтому просто "style.css" -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ========== ШАПКА САЙТА (HEADER) ========== -->
    <!-- Этот блок одинаковый на всех страницах для единообразия -->
    <header class="header">
        <!-- Контейнер ограничивает ширину содержимого и центрирует его -->
        <div class="container">
            <!-- Блок с логотипом/названием магазина -->
            <div class="header__logo">
                <!-- Ссылка ведет на главную страницу (../index.html - подняться на уровень выше) -->
                <a href="../index.html">
                    <h1>ExamShop</h1> <!-- Заголовок первого уровня - название магазина -->
                </a>
            </div>
            
            <!-- Блок с иконками навигации (в корзине нет поиска, только иконки) -->
            <div class="header__icons">
                <!-- Иконка домика - возврат на главную страницу (каталог товаров) -->
                <!-- title - всплывающая подсказка при наведении -->
                <a href="../index.html" class="icon-home" title="На главную"></a>
                
                <!-- Иконка профиля - переход в личный кабинет (история заказов) -->
                <a href="../LK/index.html" class="icon-profile" title="Личный кабинет"></a>
            </div>
        </div>
    </header>

    <!-- ========== ОБЛАСТЬ ДЛЯ УВЕДОМЛЕНИЙ ========== -->
    <!-- Сюда JavaScript будет добавлять всплывающие сообщения -->
    <!-- Изначально контейнер пуст, уведомления появляются динамически -->
    <div id="notification-area" class="notification-area"></div>
    <!-- id="notification-area" - для обращения из JavaScript -->
    <!-- class="notification-area" - для стилизации в CSS -->

    <!-- ========== ОСНОВНОЙ КОНТЕНТ СТРАНИЦЫ ========== -->
    <!-- Тег <main> обозначает главное содержимое страницы (должен быть уникальным) -->
    <main class="main">
        <!-- Контейнер для выравнивания и ограничения ширины -->
        <div class="container">
            
            <!-- ========== БЛОК КОРЗИНЫ ========== -->
            <!-- <section> - смысловой раздел страницы -->
            <section class="cart-section">
                <!-- Заголовок раздела второго уровня -->
                <h2>Корзина</h2>
                
                <!-- Контейнер для товаров в корзине -->
                <!-- id="cart-container" - для доступа из JavaScript (cart-page.js) -->
                <!-- class="cart-grid" - для стилизации сетки товаров -->
                <div id="cart-container" class="cart-grid">
                    
                    <!-- Этот блок отображается, когда корзина пуста (заглушка) -->
                    <!-- JavaScript может заменить его содержимое или удалить -->
                    <div class="empty-cart">
                        <!-- Сообщение о пустой корзине -->
                        <p>Корзина пуста</p>
                        
                        <!-- СИНЯЯ КНОПКА для перехода в каталог -->
                        <!-- class="catalog-link" - стили из style.css (синий фон, белый текст) -->
                        <!-- href="../index.html" - ссылка на главную страницу -->
                        <a href="../index.html" class="catalog-link">Перейти в каталог</a>
                    </div>
                    <!-- Когда товары появятся, этот блок будет заменен карточками товаров -->
                </div>
            </section>

            <!-- ========== БЛОК ОФОРМЛЕНИЯ ЗАКАЗА ========== -->
            <!-- section - еще один смысловой раздел -->
            <!-- style="display: none;" - изначально скрыт (показывается только когда есть товары) -->
            <section class="order-section" id="order-section" style="display: none;">
                <h2>Оформление заказа</h2>
                
                <!-- ФОРМА ЗАКАЗА -->
                <!-- Данные будут отправлены через JavaScript (manager.js) -->
                <form id="order-form">
                    
                    <!-- ПОЛЕ "Имя" - обязательное для заполнения -->
                    <div class="form-group">
                        <!-- label - подпись к полю, for="full-name" связывает с input по id -->
                        <label for="full-name">Имя *</label>
                        <!-- required - обязательное поле (браузер не даст отправить пустым) -->
                        <!-- placeholder - подсказка внутри поля (серым текстом) -->
                        <input type="text" id="full-name" name="full_name" required 
                               placeholder="Иванов Иван Иванович">
                    </div>
                    
                    <!-- ПОЛЕ "Email" - с валидацией типа email -->
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <!-- type="email" - браузер проверяет, что введен корректный email (с @) -->
                        <input type="email" id="email" name="email" required 
                               placeholder="example@mail.ru">
                    </div>
                    
                    <!-- ПОЛЕ "Телефон" - обычное текстовое поле (без специальной валидации) -->
                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input type="tel" id="phone" name="phone" required 
                               placeholder="+7 (999) 123-45-67">
                    </div>
                    
                    <!-- ЧЕКБОКС для подписки на рассылку (необязательный) -->
                    <div class="form-group checkbox">
                        <label>
                            <!-- value="1" - значение, которое отправится на сервер если чекбокс отмечен -->
                            <input type="checkbox" id="subscribe" name="subscribe" value="1"> 
                            Получать рассылку о скидках
                        </label>
                    </div>
                    
                    <!-- ПОЛЕ "Адрес доставки" -->
                    <div class="form-group">
                        <label for="delivery-address">Адрес доставки *</label>
                        <input type="text" id="delivery-address" name="delivery_address" required 
                               placeholder="г. Москва, ул. Большая Семёновская, д. 38, кв. 1">
                    </div>
                    
                    <!-- КОНТЕЙНЕР ДЛЯ ДВУХ ПОЛЕЙ В ОДНОЙ СТРОКЕ (дата и интервал) -->
                    <div class="form-row">
                        
                        <!-- ПОЛЕ "Дата доставки" - специальный тип date (показывает календарь) -->
                        <div class="form-group">
                            <label for="delivery-date">Дата доставки *</label>
                            <input type="date" id="delivery-date" name="delivery_date" required>
                            <!-- type="date" - браузер показывает удобный календарь для выбора даты -->
                        </div>
                        
                        <!-- ВЫПАДАЮЩИЙ СПИСОК для выбора интервала доставки -->
                        <div class="form-group">
                            <label for="delivery-interval">Интервал доставки *</label>
                            <!-- select - выпадающий список, option - его пункты -->
                            <select id="delivery-interval" name="delivery_interval" required>
                                <!-- Первый пункт - пустой, для обязательности выбора -->
                                <option value="">Выберите интервал</option>
                                <!-- Каждый option имеет value (значение для отправки) и текст для отображения -->
                                <option value="08:00-12:00">08:00 - 12:00 (утро)</option>
                                <option value="12:00-14:00">12:00 - 14:00 (обед)</option>
                                <option value="14:00-18:00">14:00 - 18:00 (день)</option>
                                <option value="18:00-22:00">18:00 - 22:00 (вечер)</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- ТЕКСТОВОЕ ПОЛЕ для комментария (многострочное) -->
                    <div class="form-group">
                        <label for="comment">Комментарий к заказу</label>
                        <!-- textarea - многострочное поле, rows="3" - высота в 3 строки -->
                        <textarea id="comment" name="comment" rows="3" 
                                  placeholder="Дополнительные пожелания..."></textarea>
                    </div>
                    
                    <!-- БЛОК С ИТОГОВОЙ СТОИМОСТЬЮ -->
                    <!-- Значения будут обновляться через JavaScript -->
                    <div class="order-summary">
                        <!-- Сумма товаров - значение подставляется в span -->
                        <p>Сумма товаров: <span id="total-goods-price">0</span> ₽</p>
                        <!-- Стоимость доставки - меняется в зависимости от даты/времени -->
                        <p>Стоимость доставки: <span id="delivery-price">200</span> ₽</p>
                        <!-- Итоговая сумма (товары + доставка) -->
                        <p class="total"><strong>ИТОГО: <span id="total-order-price">0</span> ₽</strong></p>
                    </div>
                    
                    <!-- КНОПКА ОТПРАВКИ ФОРМЫ -->
                    <!-- type="submit" - при нажатии вызывает событие submit формы -->
                    <button type="submit" id="submit-order" class="btn-primary">Оформить заказ</button>
                </form>
            </section>
        </div>
    </main>

    <!-- ========== ПОДВАЛ САЙТА (FOOTER) ========== -->
    <!-- Одинаковый для всех страниц, прижат к низу через CSS -->
    <footer class="footer">
        <div class="container">
            <div class="footer__info">
                <!-- Контактная информация (по заданию должна быть в подвале) -->
                <p>&copy; 2026 ExamShop - Интернет-магазин для сдачи экзамена</p>
                <p>Контактный телефон: +7 (999) 123-45-67</p>
                <p>Email: info@examshop.ru</p>
                <p>Адрес: г. Москва, ул. Большая Семёновская, д. 38</p>
            </div>
        </div>
    </footer>

    <!-- ========== ПОДКЛЮЧЕНИЕ СКРИПТОВ (JavaScript) ========== -->
    <!-- ПОРЯДОК ВАЖЕН! Скрипты выполняются последовательно -->
    
    <!-- 1. Сначала API для работы с сервером (должен быть доступен всем остальным) -->
    <script src="../js/api.js"></script>
    
    <!-- 2. Потом менеджер уведомлений (используется другими скриптами) -->
    <script src="../js/notifications.js"></script>
    
    <!-- 3. Основная логика страницы корзины (загрузка, отображение, удаление) -->
    <script src="cart-page.js"></script>
    
    <!-- 4. Менеджер заказов (отправка формы, работа с API для создания заказа) -->
    <script src="manager.js"></script>
    <!-- manager.js должен загружаться последним, так как зависит от cart-page.js -->
</body>
</html>
